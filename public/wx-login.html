<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>微信登录 · NX LIMIT Training</title>
<!-- Phone side of the website's "scan with WeChat to log in" handshake.
     Deliberately a static page (no React chunk): the desktop QR encodes the
     service-account OAuth URL which redirects here with ?t=TOKEN&code=CODE.
     This page completes the handshake against /api/wxLogin; the desktop
     polls the same token and enters the portal when we mark it ok. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 28px 22px; text-align: center;
    background: radial-gradient(700px 400px at 50% -10%, #241f17, #0d0d0d 65%);
    color: #f4f2ed;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .mark { font-weight: 900; letter-spacing: -0.02em; font-size: 30px; }
  .mark span { color: #d4af37; }
  h1 { font-size: 19px; font-weight: 700; }
  p { font-size: 14px; line-height: 1.6; color: #b9b3a4; max-width: 320px; }
  .card {
    width: 100%; max-width: 340px; display: none; flex-direction: column; gap: 10px;
    padding: 18px 16px; border: 1px solid rgba(212,175,55,.3); border-radius: 14px;
    background: rgba(255,255,255,.04); text-align: left;
  }
  .card.show { display: flex; }
  label { font-size: 13px; font-weight: 650; display: flex; flex-direction: column; gap: 5px; }
  input {
    padding: 11px 12px; border-radius: 9px; border: 1px solid rgba(212,175,55,.35);
    background: rgba(255,255,255,.06); color: #f4f2ed; font-size: 16px;
  }
  button {
    padding: 12px 16px; border: 0; border-radius: 10px; background: #d4af37;
    color: #16130c; font-size: 15px; font-weight: 800;
  }
  button:disabled { opacity: .6; }
  .ok { color: #58c98a; font-size: 46px; }
  .err { color: #e08585; font-size: 13px; min-height: 17px; }
  .divider { font-size: 12px; color: #6f6a5c; text-align: center; }
</style>
</head>
<body>
  <div class="mark">n<span>X</span>L</div>
  <h1 id="title">正在验证微信…</h1>
  <p id="subtitle">请稍候</p>
  <div class="ok" id="okmark" style="display:none">✓</div>

  <div class="card" id="bindCard">
    <p id="bindHint" style="text-align:left"></p>
    <label><span id="pinLabel"></span>
      <input id="pin" type="password" autocomplete="current-password" maxlength="64" />
    </label>
    <div class="err" id="bindErr" role="alert"></div>
    <button id="bindBtn"></button>
  </div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var zh = (params.get("lang") || navigator.language).toLowerCase().indexOf("zh") === 0;
  var copy = zh ? {
    checking: "正在验证微信…", wait: "请稍候", failed: "登录失败", retry: "请回到电脑刷新二维码后重试。",
    done: "登录成功", back: "请回到电脑，页面会自动进入你的训练客户端。", incomplete: "链接不完整，请重新扫码。",
    verify: "验证账户", once: "绑定一次，以后扫码即可登录。", hint: "首次使用微信登录，请输入教练提供的登录密码。",
    pin: "登录密码 PIN", bind: "绑定并登录", required: "请输入登录密码。", network: "网络异常，请重试。",
    invalid: "验证失败，请检查登录密码或重新扫码。", rate: "尝试次数过多，请15分钟后重试。"
  } : {
    checking: "Verifying WeChat…", wait: "Please wait", failed: "Login failed", retry: "Refresh the QR on your computer and try again.",
    done: "Logged in", back: "Return to your computer. Your training portal will open automatically.", incomplete: "Incomplete link. Please scan a new QR.",
    verify: "Verify your account", once: "Verify once, then scan to log in.", hint: "For your first WeChat login, enter the login PIN provided by your coach.",
    pin: "Login PIN", bind: "Verify and log in", required: "Enter your login PIN.", network: "Connection failed. Please try again.",
    invalid: "Verification failed. Check your PIN or scan a new QR.", rate: "Too many attempts. Try again in 15 minutes."
  };
  document.documentElement.lang = zh ? "zh-CN" : "en";
  document.title = (zh ? "微信登录" : "WeChat login") + " · NX LIMIT Training";
  var token = params.get("t") || "";
  var code = params.get("code") || "";
  var openidToken = "";
  var title = document.getElementById("title");
  var subtitle = document.getElementById("subtitle");
  var okmark = document.getElementById("okmark");
  var bindCard = document.getElementById("bindCard");
  var bindErr = document.getElementById("bindErr");
  var bindBtn = document.getElementById("bindBtn");

  title.textContent = copy.checking;
  subtitle.textContent = copy.wait;
  document.getElementById("bindHint").textContent = copy.hint;
  document.getElementById("pinLabel").textContent = copy.pin;
  bindBtn.textContent = copy.bind;

  function fail(message) {
    title.textContent = copy.failed;
    subtitle.textContent = message || copy.retry;
  }
  function done() {
    title.textContent = copy.done;
    subtitle.textContent = copy.back;
    okmark.style.display = "block";
    bindCard.classList.remove("show");
  }
  function post(body) {
    return fetch("/api/wxLogin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, status: res.status, data: data }; });
    });
  }

  if (!token || !code) {
    fail(copy.incomplete);
    return;
  }

  post({ action: "scan", t: token, code: code }).then(function (result) {
    if (result.ok && result.data.status === "ok") return done();
    if (result.ok && result.data.status === "needs_bind") {
      openidToken = result.data.openidToken || "";
      title.textContent = copy.verify;
      subtitle.textContent = copy.once;
      bindCard.classList.add("show");
      return;
    }
    fail(result.status === 429 ? copy.rate : copy.invalid);
  }).catch(function () { fail(copy.network); });

  bindBtn.addEventListener("click", function () {
    var pin = document.getElementById("pin").value.trim();
    bindErr.textContent = "";
    if (!pin) {
      bindErr.textContent = copy.required;
      return;
    }
    bindBtn.disabled = true;
    var body = { action: "bind", t: token, openidToken: openidToken };
    body.pin = pin;
    post(body).then(function (result) {
      bindBtn.disabled = false;
      if (result.ok && result.data.status === "ok") return done();
      bindErr.textContent = result.status === 429 ? copy.rate : copy.invalid;
    }).catch(function () {
      bindBtn.disabled = false;
      bindErr.textContent = copy.network;
    });
  });
})();
</script>
</body>
</html>
