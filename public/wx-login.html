<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>微信登录 · NX LIMIT Training</title>
<!-- Phone side of the website's "scan with WeChat to log in" handshake.
     Deliberately a static page (no React chunk): the desktop QR encodes the
     service-account OAuth URL which redirects here with ?t=TOKEN&code=CODE.
     This page completes the handshake against /api/wxLogin; the desktop
     polls the same token and enters the portal when we mark it ok. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 28px 22px; text-align: center;
    background: radial-gradient(700px 400px at 50% -10%, #241f17, #0d0d0d 65%);
    color: #f4f2ed;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .mark { font-weight: 900; letter-spacing: -0.02em; font-size: 30px; }
  .mark span { color: #d4af37; }
  h1 { font-size: 19px; font-weight: 700; }
  p { font-size: 14px; line-height: 1.6; color: #b9b3a4; max-width: 320px; }
  .card {
    width: 100%; max-width: 340px; display: none; flex-direction: column; gap: 10px;
    padding: 18px 16px; border: 1px solid rgba(212,175,55,.3); border-radius: 14px;
    background: rgba(255,255,255,.04); text-align: left;
  }
  .card.show { display: flex; }
  label { font-size: 13px; font-weight: 650; display: flex; flex-direction: column; gap: 5px; }
  input {
    padding: 11px 12px; border-radius: 9px; border: 1px solid rgba(212,175,55,.35);
    background: rgba(255,255,255,.06); color: #f4f2ed; font-size: 16px;
  }
  button {
    padding: 12px 16px; border: 0; border-radius: 10px; background: #d4af37;
    color: #16130c; font-size: 15px; font-weight: 800;
  }
  button:disabled { opacity: .6; }
  .ok { color: #58c98a; font-size: 46px; }
  .err { color: #e08585; font-size: 13px; min-height: 17px; }
  .divider { font-size: 12px; color: #6f6a5c; text-align: center; }
</style>
</head>
<body>
  <div class="mark">n<span>X</span>L</div>
  <h1 id="title">正在验证微信…</h1>
  <p id="subtitle">请稍候</p>
  <div class="ok" id="okmark" style="display:none">✓</div>

  <div class="card" id="bindCard">
    <p style="text-align:left">首次使用微信登录，请验证你的账户（二选一）：</p>
    <label>登录密码 PIN
      <input id="pin" inputmode="numeric" placeholder="例如 111111" />
    </label>
    <div class="divider">— 或 手机号 + 姓名 —</div>
    <label>手机号 / 微信号
      <input id="phone" placeholder="购买时填写的联系方式" />
    </label>
    <label>姓名
      <input id="name" placeholder="购买时填写的姓名" />
    </label>
    <div class="err" id="bindErr"></div>
    <button id="bindBtn">绑定并登录</button>
  </div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var token = params.get("t") || "";
  var code = params.get("code") || "";
  var openidToken = "";
  var title = document.getElementById("title");
  var subtitle = document.getElementById("subtitle");
  var okmark = document.getElementById("okmark");
  var bindCard = document.getElementById("bindCard");
  var bindErr = document.getElementById("bindErr");
  var bindBtn = document.getElementById("bindBtn");

  function fail(message) {
    title.textContent = "登录失败";
    subtitle.textContent = message || "请回到电脑刷新二维码后重试。";
  }
  function done() {
    title.textContent = "登录成功";
    subtitle.textContent = "请回到电脑——页面会自动进入你的训练客户端。";
    okmark.style.display = "block";
    bindCard.classList.remove("show");
  }
  function post(body) {
    return fetch("/api/wxLogin", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, data: data }; });
    });
  }

  if (!token || !code) {
    fail("链接不完整——请重新扫码。");
    return;
  }

  post({ action: "scan", t: token, code: code }).then(function (result) {
    if (result.ok && result.data.status === "ok") return done();
    if (result.ok && result.data.status === "needs_bind") {
      openidToken = result.data.openidToken || "";
      title.textContent = "验证账户";
      subtitle.textContent = "绑定一次，以后扫码即登录。";
      bindCard.classList.add("show");
      return;
    }
    fail(result.data && result.data.error);
  }).catch(function () { fail("网络异常，请重试。"); });

  bindBtn.addEventListener("click", function () {
    var pin = document.getElementById("pin").value.trim();
    var phone = document.getElementById("phone").value.trim();
    var name = document.getElementById("name").value.trim();
    bindErr.textContent = "";
    if (!pin && !(phone && name)) {
      bindErr.textContent = "请填写登录密码，或手机号加姓名。";
      return;
    }
    bindBtn.disabled = true;
    var body = { action: "bind", t: token, openidToken: openidToken };
    if (pin) { body.pin = pin; } else { body.phone = phone; body.name = name; }
    post(body).then(function (result) {
      bindBtn.disabled = false;
      if (result.ok && result.data.status === "ok") return done();
      bindErr.textContent = (result.data && result.data.error) || "绑定失败，请重试。";
    }).catch(function () {
      bindBtn.disabled = false;
      bindErr.textContent = "网络异常，请重试。";
    });
  });
})();
</script>
</body>
</html>
