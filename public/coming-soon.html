<!-- Launch gate page. Nginx on the Shanghai box rewrites every non-API,
     non-cookie-holding request here until launch. Self-contained on purpose:

     compliant page. -->
<meta name="robots" content="noindex, nofollow">
<title>NX//LIMIT — Coming Soon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(900px 480px at 50% -10%, #241f17, #0d0d0d 65%);
    color: #f4f2ed;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px 20px; gap: 0;
  }
  .mark {
    font-weight: 900; letter-spacing: -0.02em; text-transform: uppercase;
    font-size: clamp(40px, 9vw, 76px); line-height: 0.95; color: #ffffff;
  }
  .mark span { color: #d4af37; }
  .slogan {
    margin-top: 18px; font-weight: 800; letter-spacing: 0.24em;
    text-transform: uppercase; font-size: clamp(10px, 2.4vw, 13px); color: #8d8571;
  }
  .slogan b { color: #f0dc88; font-weight: 800; }
  .rule { width: 56px; height: 3px; background: #d4af37; margin: 34px auto 30px; }
  .soon { font-size: clamp(17px, 3.6vw, 21px); font-weight: 700; color: #e8e2d2; }
  .sub { margin-top: 10px; font-size: clamp(13px, 3vw, 15px); color: #9a927c; max-width: 34em; }
  .site-name {
    font-size: 15px; letter-spacing: 0.3em; color: #c9c0ad; margin-bottom: 14px;
    font-weight: 700;
  }
  .cards {
    display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    margin-top: 30px; max-width: 720px;
  }
  .card {
    border: 1px solid rgba(212, 175, 55, 0.35); border-radius: 12px;
    padding: 14px 18px; min-width: 180px;
  }
  .card b { display: block; color: #f0dc88; font-size: 14px; margin-bottom: 4px; }
  .card span { font-size: 12px; color: #9a927c; }
  .contact { margin-top: 26px; font-size: 13px; color: #9a927c; }
  footer { position: fixed; bottom: 22px; left: 0; right: 0; font-size: 12px; }
  footer a { color: #6f6a5c; text-decoration: none; }
  footer a:hover { color: #f0dc88; }
</style>
</head>
<body>
  <div class="site-name">跃燃体育训练平台</div>

  <div class="cards">

  </div>
  <div class="contact">联系我们：trainnolimit@outlook.com</div>
  <footer><a href="https://beian.miit.gov.cn" target="_blank" rel="noreferrer">粤ICP备2026103091号</a></footer>
